name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            ./ _site/
          touch _site/.nojekyll
          echo "ไฟล์ที่จะขึ้นเว็บ:"
          find _site -type f | wc -l
          
      - name: Stamp asset version
        run: |
          V="${GITHUB_SHA:0:7}"
          find _site -name '*.html' -print0 |
            xargs -0 sed -i -E "s@(src|href)=\"((\.\./)*assets/[^\"?]+)\"@\1=\"\2?v=$V\"@g"
          echo "เลขรุ่น: $V"
          echo "จำนวน URL ที่ต่อเลขรุ่นแล้ว:"
          grep -roh "?v=$V" _site --include='*.html' | wc -l
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
